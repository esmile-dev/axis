server:
  port: 7789

spring:
  web:
    error:
      # Include the exception message in the error body so ResponseStatusException
      # reasons (e.g. FETCH_FAILED / EXTRACT_FAILED) reach the client.
      # (Spring Boot 4 moved server.error.* to spring.web.error.*)
      include-message: always
  servlet:
    multipart:
      # Knowledge 2.0 file import (FR-003): accept up to 20MB per file.
      # Boot 4 keeps these keys in the spring-boot-servlet module; defaults are
      # max-file-size=1MB / max-request-size=10MB. Request limit sits slightly
      # above the file limit so an exactly-20MB file still passes multipart
      # framing overhead.
      max-file-size: 20MB
      max-request-size: 21MB
  application:
    name: axis-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/axis}
    username: ${DB_USERNAME:alan}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway 管 schema，Hibernate 只校验实体与库一致（不一致即启动失败）
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    # 已有的开发库（无 flyway_schema_history）首次启动时按基线处理，跳过 V1；
    # 全新空库则从 V1__init.sql 建全量 schema
    baseline-on-migrate: true

  ai:
    # Knowledge 2.0 FR-010：PgVectorStore 由 KnowledgeSearchConfig 探测 pgvector 后手工装配，
    # 关闭自动装配（否则它会用 env 兜底的 EmbeddingModel 无条件再建一个 store）。
    vectorstore:
      type: none
    openai:
      # Env vars are the fallback when no AI config profile exists in DB.
      # Preferred workflow: add/activate profiles via Settings UI; DB is the source of truth.
      api-key: ${AI_API_KEY:demo}
      base-url: ${AI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${AI_MODEL:gpt-4o-mini}
          temperature: 0.7

# CORS configuration
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:7788,http://localhost:3000}
  upload:
    dir: ${UPLOAD_DIR:./uploads}

  # Daily Digest feature — see docs/feature/daily-digest/requirements.md
  digest:
    # Trigger times: 10:00, 12:00, 14:00, 20:00, 22:00 daily
    cron: "0 0 10,12,14,20,22 * * *"
    # RSS sources (Chinese tech media, verified reachable 2026-07-21)
    rss-sources:
      - name: 36氪
        url: https://36kr.com/feed
      - name: InfoQ
        url: https://feed.infoq.com/
      - name: 雷锋网
        url: https://www.leiphone.com/feed
      - name: 钛媒体
        url: https://www.tmtpost.com/rss.xml
      - name: IT之家
        url: https://www.ithome.com/rss/
      - name: 开源中国
        url: https://www.oschina.net/news/rss
      - name: 少数派
        url: https://sspai.com/feed
    # Classifier — case-insensitive substring match against title + summary
    classifier:
      impl: keyword
      keywords:
        ai-frontier: AI,LLM,GPT,multimodal,embodied,chip,GPU,PyTorch,JAX,alignment,大模型,ChatGPT,Sora,具身智能,算力
        tech-industry: cloud,database,DB,HarmonyOS,Android,iOS,kubernetes,microservice,distributed,frontend,鸿蒙,微服务,Java
        finance-tech: NVIDIA,TSMC,BAT,earnings,财报,investment,市值,半导体,投融资
    # Timeouts (seconds)
    timeout:
      per-source-seconds: 60
      total-seconds: 300
    # Parallel fetch thread pool
    thread-pool-size: 8

  # Knowledge hybrid search — see docs/feature/knowledge-hybrid-search/lite-spec.md
  knowledge:
    search:
      vector-top-k: 10
      keyword-top-k: 10
      # cosine similarity 下限（[0,1]，越大越相似）；宽松起点，由 RetrievalEval 数字校准
      similarity-threshold: 0.2
      rerank:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
