server:
  port: 7789

spring:
  application:
    name: axis-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:alan}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false

  ai:
    openai:
      api-key: ${AI_API_KEY:demo}
      base-url: ${AI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${AI_MODEL:gpt-4o-mini}
          temperature: 0.7

# CORS configuration
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:7788,http://localhost:3000}
  upload:
    dir: ${UPLOAD_DIR:./uploads}

  # Daily Digest feature — see features/daily-digest/REQUIREMENTS.md
  digest:
    # Trigger times: 10:00, 12:00, 14:00, 20:00, 22:00 daily
    cron: "0 0 10,12,14,20,22 * * *"
    # Directory holding daily-YYYY-MM-DD.md files
    inbox-dir: ${DIGEST_INBOX_DIR:./inbox}
    # RSS sources (Chinese tech media)
    rss-sources:
      - name: 36氪
        url: https://36kr.com/feed
      - name: 机器之心
        url: https://www.jiqizhixin.com/rss
      - name: InfoQ
        url: https://feed.infoq.com/
      - name: 虎嗅科技版
        url: https://www.huxiu.com/rss/0.xml
    # Classifier — case-insensitive substring match against title + summary
    classifier:
      impl: keyword
      keywords:
        ai-frontier: AI,LLM,GPT,multimodal,embodied,chip,GPU,PyTorch,JAX,alignment,大模型,ChatGPT,Sora,具身智能,算力
        tech-industry: cloud,database,DB,HarmonyOS,Android,iOS,kubernetes,microservice,distributed,frontend,鸿蒙,微服务
        finance-tech: NVIDIA,TSMC,BAT,earnings,财报,investment,市值,半导体,投融资
    # Timeouts (seconds)
    timeout:
      per-source-seconds: 5
      total-seconds: 15
    # Parallel fetch thread pool
    thread-pool-size: 8

management:
  endpoints:
    web:
      exposure:
        include: health,info
